name: Flask CI Native

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite Database
      working-directory: ./
      run: |
        # Запускаем через -m, чтобы корень проекта был в sys.path
        python -m manage db upgrade

    - name: Smoke test Flask server
      working-directory: ./
      run: |
        python -m manage runserver -h 127.0.0.1 -p 7345 &
        SERVER_PID=$!
        sleep 5
        curl -f http://127.0.0.1:7345/ || exit 1
        kill $SERVER_PID
