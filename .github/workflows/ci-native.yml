name: Flask CI Native

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite Database
      run: |
        python manage.py db upgrade

    - name: Smoke test Flask server
      run: |
        # Запускаем сервер в фоне (используем runserver из Flask-Script)
        python manage.py runserver -h 127.0.0.1 -p 7345 &
        SERVER_PID=$!
        
        # Ждем, пока сервер запустится (до 10 секунд)
        sleep 5
        
        # Проверяем, отвечает ли сервер (используем curl с флагом -f, чтобы упасть при ошибке)
        curl -f http://127.0.0.1:7345/ || exit 1
        
        # Останавливаем сервер
        kill $SERVER_PID
